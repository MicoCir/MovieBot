[project]
name = "moviebot"
version = "0.1.0"
description = "Movie recommendation chatbot using LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "langchain-openai",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "meilisearch",
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: tests that require external services (TMDB API, network, etc.)",
]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = [
    "moviebot.repositories.tmdb_connector",
    "moviebot.repositories.fixture_writer",
    "moviebot.repositories.tmdb_errors",
    "moviebot.repositories.tmdb_models",
    "moviebot.tools.*",
]
disallow_untyped_defs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moviebot"]
